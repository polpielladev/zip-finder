name: Release Build

on:
  push:
    branches:
      - "release/ios/*.*.*"
      - "release/macos/*.*.*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: true
        default: "ios"
        type: choice
        options:
          - ios
          - macos
      version:
        description: "Version number"
        required: true
        default: "1.0.0"
        type: string

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
